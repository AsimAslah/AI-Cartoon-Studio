[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cartoon-studio-3d"
version = "0.2.0"
description = "Local-first procedural 3D cartoon creation with Blender and FastAPI"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "python-multipart>=0.0.17,<1",
  "pydantic>=2.9,<3", "pypdf>=5,<7", "python-docx>=1.1,<2"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
video = ["gradio_client>=1.3,<3", "huggingface_hub>=2.1,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
